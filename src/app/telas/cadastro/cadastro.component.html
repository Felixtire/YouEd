<!-- TOOLBAR -->
<mat-toolbar class="toolbar">
  <img
    src="assets/img/img.png"
    alt="Logo"
    class="logo"
    routerLink="">
</mat-toolbar>

<!-- FORMULÁRIO -->
<form class="form">

  <mat-card class="card mat-elevation-z6">

    <mat-card-title>Cadastre-se</mat-card-title>

    <div class="fields">

      <mat-form-field appearance="outline">
        <mat-label>Nome</mat-label>
        <input matInput name="nome" required [(ngModel)]="usuario.nome">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Data de nascimento</mat-label>
        <input matInput type="date" name="dataNascimento" required [(ngModel)]="usuario.dataNascimento">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Telefone</mat-label>
        <input matInput name="telefone" required [(ngModel)]="usuario.telefone">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>CPF</mat-label>
        <input matInput name="cpf" mask="000.000.000-00" required [(ngModel)]="usuario.cpf">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>E-mail</mat-label>
        <input matInput type="email" name="email" required [(ngModel)]="usuario.email">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Senha</mat-label>
        <input matInput type="password" name="senha" required [(ngModel)]="usuario.senha">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Confirmar senha</mat-label>
        <input matInput type="password" name="confirmarSenha" required [(ngModel)]="usuario.confirmarSenha">
      </mat-form-field>

    </div>

    <!-- RADIOS -->
    <div class="radios">
      <mat-radio-group name="tipo" [(ngModel)]="usuario.tipo">
        <mat-radio-button value="ALUNO">Sou Aluno</mat-radio-button>
        <mat-radio-button value="PROFESSOR">Sou Professor</mat-radio-button>
      </mat-radio-group>
    </div>

    <!-- BOTÃO -->
    <button
      mat-raised-button
      class="btn-cadastrar"
      type="button"
      (click)="cadastrar()">
      Cadastrar
    </button>

  </mat-card>
</form>
