<mat-toolbar>
  <img src="assets/img/img.png">
</mat-toolbar>

<div class="main">
  <mat-card-title>
    Faça seu login
  </mat-card-title>

  <div class="form">
  <mat-form-field appearance="outline">
    <mat-label>E-mail:</mat-label>
    <input matInput required >
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Senha</mat-label>
    <input matInput required >
  </mat-form-field>
    <button mat-raised-button>Log in</button>
    <a mat-button routerLink="cadastro">Não possuo cadastro</a>

  </div>
</div>
