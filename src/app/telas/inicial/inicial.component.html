<mat-toolbar>
  <img src="assets/img/img.png">
</mat-toolbar>

<div class="main">
  <mat-card-title>
    Faça seu login
  </mat-card-title>

  <div class="form">
  <mat-form-field appearance="outline">
    <mat-label>E-mail:</mat-label>
    <input matInput required [(ngModel)]="user.email" >
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Senha</mat-label>
    <input matInput required [(ngModel)]="user.senha">
  </mat-form-field>

    <div class="red" *ngIf="mostrarErro">
      <p>Email ou senha inválidos</p>
    </div>

    <button mat-raised-button (click)="logar()">Log in</button>
    <a mat-button routerLink="/cadastrar">Não possuo cadastro</a>

  </div>
</div>
